<div
  class="overflow-x-auto"
  role="region"
  tabindex="0"
  aria-label="Resource table"
>
  <table class="w-full border-collapse text-left text-sm">
    <thead>
      <tr class="border-b border-gray-200">
        @for (field of fields(); track field.name) {
        <th
          class="px-3 py-2 font-medium text-gray-700"
          [attr.aria-sort]="ariaSort(field)"
        >
          @if (isSortable(field)) {
          <button
            type="button"
            class="inline-flex items-center gap-1 font-medium text-gray-700 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
            (click)="toggleSort(field)"
          >
            {{ columnHeader(field) }}<span aria-hidden="true"
              >{{ sortIndicator(field) }}</span
            >
          </button>
          } @else { {{ columnHeader(field) }} }
        </th>
        } @if (actions()) {
        <th class="px-3 py-2 font-medium text-gray-700">Actions</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of data(); track row['id'] ?? $index) {
      <tr class="border-b border-gray-100">
        @for (field of fields(); track field.name) {
        <td class="px-3 py-2 align-top" [attr.title]="row[field.name]">
          <span class="block max-w-[12rem] truncate">{{ row[field.name] }}</span>
        </td>
        } @if (actions(); as actionsTemplate) {
        <td class="px-3 py-2 align-top whitespace-nowrap">
          <ng-container
            *ngTemplateOutlet="actionsTemplate; context: { $implicit: row }"
          />
        </td>
        }
      </tr>
      }
    </tbody>
  </table>
</div>
