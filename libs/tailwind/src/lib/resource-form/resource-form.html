<form
  [formRoot]="model"
  (submit)="onSubmit($event)"
  [attr.aria-busy]="pending()"
  class="flex max-w-xl flex-col items-stretch gap-4"
>
  @for (field of editableFields(); track field.name) { @if (field.type ===
  'boolean') {
  <label class="flex items-center gap-2 text-sm text-gray-700">
    <input
      type="checkbox"
      [formField]="booleanFieldTree(field.name)"
      class="h-4 w-4 rounded border-gray-300"
    />
    {{ fieldLabel(field) }}
  </label>
  @if (fieldHint(field); as hint) {
  <span class="text-xs text-gray-500">{{ hint }}</span>
  } } @else {
  <label class="flex flex-col gap-1 text-sm text-gray-700">
    {{ fieldLabel(field) }}
    <input
      [type]="inputType(field)"
      [formField]="fieldTree(field.name)"
      class="rounded border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none"
    />
    @if (fieldError(field); as error) {
    <span class="text-sm text-red-600" role="alert">{{ error }}</span>
    } @else if (fieldHint(field); as hint) {
    <span class="text-xs text-gray-500">{{ hint }}</span>
    }
  </label>
  } }

  <button
    type="submit"
    [disabled]="pending()"
    class="self-start rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
  >
    {{ pending() ? 'Saving…' : 'Save' }}
  </button>
</form>
