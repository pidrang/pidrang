<form
  [formRoot]="model"
  (submit)="onSubmit($event)"
  [attr.aria-busy]="pending()"
>
  @for (field of fields(); track field.name) { @if (field.type === 'boolean') {
  <mat-checkbox [formField]="fieldTree(field.name)"
    >{{ fieldLabel(field) }}</mat-checkbox
  >
  @if (fieldHint(field); as hint) {
  <p class="field-hint">{{ hint }}</p>
  } } @else {
  <mat-form-field>
    <mat-label>{{ fieldLabel(field) }}</mat-label>
    <input
      matInput
      [type]="inputType(field)"
      [formField]="fieldTree(field.name)"
    />
    @if (fieldError(field); as error) {
    <mat-error>{{ error }}</mat-error>
    } @else if (fieldHint(field); as hint) {
    <mat-hint>{{ hint }}</mat-hint>
    }
  </mat-form-field>
  } }

  <button mat-flat-button color="primary" type="submit" [disabled]="pending()">
    {{ pending() ? 'Saving…' : 'Save' }}
  </button>
</form>
