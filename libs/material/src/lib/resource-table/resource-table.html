<table mat-table [dataSource]="data()">
  @for (field of fields(); track $index) {
  <ng-container [matColumnDef]="fieldColumn($index)">
    <th mat-header-cell *matHeaderCellDef>{{ columnHeader(field) }}</th>
    <td mat-cell *matCellDef="let row">{{ row[field.name] }}</td>
  </ng-container>
  } @if (actions(); as actionsTemplate) {
  <ng-container [matColumnDef]="actionsColumn">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      <ng-container
        *ngTemplateOutlet="actionsTemplate; context: { $implicit: row }"
      />
    </td>
  </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
</table>
