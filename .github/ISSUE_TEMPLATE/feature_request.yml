name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Pidrang does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketch the API if you have one in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@pidrang/core'
        - '@pidrang/supabase'
        - '@pidrang/material'
        - '@pidrang/tailwind'
        - 'pidrang CLI'
        - New package
        - Documentation
    validations:
      required: true
