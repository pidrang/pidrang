name: Docs artifacts

on:
  pull_request:
    paths:
      - docs/**
      - tools/docs/**
      - .github/workflows/docs-artifacts.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build. Defaults to the branch the workflow is run from.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node tools/docs/build.mjs

      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: docs-${{ steps.source.outputs.sha }}
          path: dist/pages/docs
          if-no-files-found: error
          retention-days: 30
