name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version (for example 0.1.0) or bump keyword (patch, minor, major). Leave empty to derive it from Conventional Commits.
        required: false
        type: string
      first-release:
        description: Set for the very first release, when no version tag exists yet.
        required: false
        default: false
        type: boolean
      dry-run:
        description: Preview the release without committing, tagging, pushing or publishing.
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-gate.yml
    secrets:
      SUPABASE_FIXTURES_TOKEN: ${{ secrets.SUPABASE_FIXTURES_TOKEN }}

  release:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx run-many -t lint test build

      - run: pnpm run verify:artifacts

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          VERSION: ${{ inputs.version }}
          FIRST_RELEASE: ${{ inputs.first-release }}
          DRY_RUN: ${{ inputs.dry-run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          args=()
          if [ -n "$VERSION" ]; then args+=("$VERSION"); fi
          if [ "$FIRST_RELEASE" = "true" ]; then args+=("--first-release"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=("--dry-run"); fi
          pnpm exec nx release "${args[@]}" --yes
