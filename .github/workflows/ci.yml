name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: npm install -g npm@11.21.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx run-many -t lint test build

      - run: pnpm run sync:pages -- --check

      - run: pnpm run sync:layout -- --check

      - run: pnpm exec eslint tools/release-gate tools/shared.mjs tools/versioned-packages.mjs tools/verify-artifacts.mjs tools/changelog-renderer.mjs tools/changelog-renderer.test.mjs

      - run: node --test tools/changelog-renderer.test.mjs

      - run: node tools/release-gate/run.mjs --mode build

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-build-${{ github.sha }}
          path: tmp/release-gate
          if-no-files-found: ignore
          retention-days: 14
