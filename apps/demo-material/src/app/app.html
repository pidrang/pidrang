@if (hasSupabaseConfig) {
<app-layout [appName]="appName" />
} @else {
<p>
  Missing Supabase configuration. Set <code>supabaseUrl</code> and
  <code>supabasePublishableKey</code> in
  <code>apps/demo-material/src/environments/environment.ts</code> (or
  <code>environment.local.ts</code> for local dev) to a real Supabase project
  before running the demo.
</p>
}
